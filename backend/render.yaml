services:
  - type: web
    name: yumix-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build && npm prune --omit=dev
    startCommand: npx prisma db push && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: NODE_ENV
        value: production
      # Supabase Postgres — set both in Render dashboard (Project Settings → Database → ORM → Prisma)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://www.yumix.ge
